spring.application.name=split-bill
server.port=${PORT:8080}
# files in the jar all carry a 1980 timestamp, so browsers keep stale pages
# after a deploy; make them check with the server every time
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.use-last-modified=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
ocr.tessdata=${TESSDATA:tessdata}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-4-hydrogen}
